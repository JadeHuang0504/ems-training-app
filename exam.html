<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>測驗中</title>
</head>
<body>

  <h2 id="status"></h2>
  <h3 id="timer"></h3>

  <p id="question"></p>

<div id="options"></div>

<div id="explanation"
     style="display:none; margin-top:16px; padding:12px; border:1px solid #ccc;">
</div>

<br>
<button type="button" id="nextBtn">下一題</button>
<button type="button" id="finishBtn">提前結束測驗</button>


  <!-- 一定是：題庫 → 邏輯 -->
  <script src="js/data/ohca.js"></script>
  <script src="js/exam.js"></script>

  <script>
    const module = localStorage.getItem("current_module");
    const mode = localStorage.getItem("exam_mode");

    document.getElementById("status").innerText =
      `${module}｜${mode === "timed" ? "90 秒限時" : "練習模式"}`;

    // ⚠️ 在這裡「綁定事件」
    document.getElementById("nextBtn")
      .addEventListener("click", nextQuestion);

    document.getElementById("finishBtn")
      .addEventListener("click", finishExam);

    startExam(mode);
  </script>

</body>
</html>

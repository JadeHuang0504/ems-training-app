<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>選擇模式</title>
</head>
<body>
  <h2 id="moduleTitle"></h2>
  <button onclick="start('practice')">🧠 練習模式</button>
  <button onclick="start('timed')">⏱ 90 秒限時</button>
  <script>
    const module = localStorage.getItem("current_module");
    document.getElementById("moduleTitle").innerText = module + " 測驗";
    function start(mode) {
      localStorage.setItem("exam_mode", mode);
      location.href = "exam.html";
    }
  </script>
</body>
</html>
